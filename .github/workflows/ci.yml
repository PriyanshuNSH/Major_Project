name: HealthSync AI — Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Backend CI: Python 3.11 + Automated Unit Tests + Security Audit
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run backend automated unit test suite
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_ci.db"
          ENVIRONMENT: "test"
          JWT_SECRET_KEY: "healthsync_development_secret_key_at_least_256_bits_long_for_security"
          LOKY_MAX_CPU_COUNT: "2"
        run: |
          cd backend
          python -m pytest \
            tests/test_health.py \
            tests/test_modules.py \
            tests/test_openapi.py \
            tests/test_schemas.py \
            tests/test_security_audit.py \
            tests/test_docker_configuration.py \
            tests/test_k8s_configuration.py \
            tests/test_cicd_configuration.py \
            -v --tb=short

  # ----------------------------------------------------------------------------
  # 2. Frontend CI: Node 22 + Unit Tests + TypeScript Check + Production Build
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Run TypeScript typecheck & production build
        working-directory: frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # 3. Docker Image Build Validation (Multi-stage + Non-root + Bundled Artifacts)
  # ----------------------------------------------------------------------------
  docker-build-validation:
    name: Docker Build Validation
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: healthsync-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: healthsync-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # 4. Kubernetes Manifests Validation & Security Policy Audit
  # ----------------------------------------------------------------------------
  k8s-manifest-validation:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 for K8s verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend and validation dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt pyyaml

      - name: Validate Kubernetes Manifests & Security Policies
        run: |
          cd backend
          python -m pytest tests/test_k8s_configuration.py -v

  # ----------------------------------------------------------------------------
  # 5. Security & Secret Leakage Inspection
  # ----------------------------------------------------------------------------
  security-audit:
    name: Security & Secret Leakage Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify zero committed .env files or private keys
        run: |
          # Assert that no .env files (except .env.example) exist in tracked Git index
          COMMITTED_ENVS=$(git ls-files | grep -E '(^|/)\.env($|\..*)' | grep -v '\.env\.example' || true)
          if [ -n "$COMMITTED_ENVS" ]; then
            echo "ERROR: Committed .env file(s) detected in Git index:"
            echo "$COMMITTED_ENVS"
            exit 1
          fi
          echo "Verified: No sensitive .env files tracked in Git repository."

          # Assert that no private key files (.pem, .key, .cert) exist in tracked Git index
          COMMITTED_KEYS=$(git ls-files | grep -E '\.(pem|key|cert|crt|p12|pfx)$' || true)
          if [ -n "$COMMITTED_KEYS" ]; then
            echo "ERROR: Committed private key file(s) detected in Git index:"
            echo "$COMMITTED_KEYS"
            exit 1
          fi
          echo "Verified: No private key certificates tracked in Git repository."
