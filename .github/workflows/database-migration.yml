name: HealthSync AI — Controlled Database Migration

on:
  workflow_dispatch:
    inputs:
      confirm_action:
        description: "Type 'MIGRATE' to confirm applying database migrations"
        required: true
        default: ""
      target_revision:
        description: "Alembic target revision (e.g. 'head' or specific revision hash)"
        required: true
        default: "head"

permissions:
  contents: read

concurrency:
  group: db-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # Controlled Database Migration Job
  # ----------------------------------------------------------------------------
  apply-migration:
    name: Execute Alembic Database Migration
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Validate Manual Confirmation Safeguard
        run: |
          if [ "${{ github.event.inputs.confirm_action }}" != "MIGRATE" ]; then
            echo "ERROR: Database migration aborted."
            echo "Safety confirmation mismatch: expected 'MIGRATE', received '${{ github.event.inputs.confirm_action }}'."
            echo "To protect clinical and production data, migrations cannot proceed without explicit confirmation."
            exit 1
          fi
          echo "Safeguard validated: Manual confirmation 'MIGRATE' supplied."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Verify Target Database URL Availability
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: DATABASE_URL secret is not configured in the 'production' environment."
            echo "Cannot execute database migrations without a valid database connection string."
            exit 1
          fi
          echo "Target DATABASE_URL secret detected."

      - name: Execute Alembic Migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          echo "Applying migration to revision: ${{ github.event.inputs.target_revision }}"
          alembic upgrade "${{ github.event.inputs.target_revision }}"
          echo "Migration successfully completed."
