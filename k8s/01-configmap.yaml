apiVersion: v1
kind: ConfigMap
metadata:
  name: healthsync-config
  namespace: healthsync
  labels:
    app.kubernetes.io/name: healthsync-config
    app.kubernetes.io/part-of: healthsync-ai
data:
  ENVIRONMENT: "production"
  HOST: "0.0.0.0"
  PORT: "8000"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "http://localhost:5173,http://localhost:8080,http://localhost:80,https://healthsync.local"
  FRONTEND_URL: "http://localhost:5173"
  ML_MODELS_DIR: "/app/ml/artifacts"
  SMTP_ENABLED: "false"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USE_TLS: "true"
  SMTP_USE_SSL: "false"
  SMTP_FROM_NAME: "HealthSync AI"
  MANDATORY_DISCLAIMER: "Informational risk estimation only. Not a medical diagnosis or clinical substitute. Consult a healthcare professional."
