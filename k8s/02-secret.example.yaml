# ==============================================================================
# HealthSync AI — Kubernetes Secret Template (Example)
# IMPORTANT: Never commit actual secrets to version control.
#
# Production deployment instructions:
# Option A (Recommended): Create directly via kubectl command-line:
#   kubectl create secret generic healthsync-secrets -n healthsync \
#     --from-literal=DATABASE_URL="postgresql+asyncpg://<neon_user>:<neon_pw>@<neon_host>.neon.tech/<dbname>?ssl=require" \
#     --from-literal=JWT_SECRET_KEY="<cryptographic-secret-at-least-32-chars-long>" \
#     --from-literal=SMTP_USERNAME="" \
#     --from-literal=SMTP_PASSWORD="" \
#     --from-literal=SMTP_FROM_EMAIL="noreply@healthsync.ai"
#
# Option B: Copy this file to 02-secret.yaml (git-ignored), edit values, and apply:
#   kubectl apply -f k8s/02-secret.yaml
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: healthsync-secrets
  namespace: healthsync
  labels:
    app.kubernetes.io/name: healthsync-secrets
    app.kubernetes.io/part-of: healthsync-ai
type: Opaque
stringData:
  # External Neon PostgreSQL connection string (asyncpg driver with SSL require)
  DATABASE_URL: "postgresql+asyncpg://<neon_user>:<neon_password>@<neon_endpoint>.neon.tech/<dbname>?ssl=require"
  # Cryptographic JWT signature key (minimum 32 characters / 256 bits)
  JWT_SECRET_KEY: "REPLACE_WITH_CRYPTOGRAPHICALLY_SECURE_KEY_MIN_32_CHARS"
  # SMTP credentials (optional)
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_FROM_EMAIL: "noreply@healthsync.ai"
