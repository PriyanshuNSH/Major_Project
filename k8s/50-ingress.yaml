# ==============================================================================
# HealthSync AI — Kubernetes Ingress Manifest (Optional Gateway)
# Routes external HTTP(S) traffic to the Frontend Service
# Compatible with ingress-nginx, Traefik, or cloud application load balancers
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthsync-ingress
  namespace: healthsync
  labels:
    app.kubernetes.io/name: healthsync-ingress
    app.kubernetes.io/part-of: healthsync-ai
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "false" # Set true when TLS is configured
spec:
  rules:
    - host: healthsync.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
